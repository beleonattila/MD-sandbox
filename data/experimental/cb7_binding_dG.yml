# Ground truth for branch A (binding affinity) on cucurbit[7]uril (CB7): standard binding
# free energies of the two CB7 benchmark sets proposed by Mobley & Gilson. Adopted as
# published, not curated (docs/GROUND_TRUTH.md). Used by src/mdbench/branch_a/cb7.py.
system: cb7
observable: standard_binding_free_energy
value: per guest, see `guests`
data_file: null
uncertainty: per guest, see `guests`
uncertainty_kind: sem          # triplicate sd / sqrt(3), as stated in the source table footnote
units: kcal/mol
temperature_K: 298.0
buffer: 50 mM sodium acetate in D2O
pH: 4.74
doi: 10.1146/annurev-biophys-070816-033654
location: >-
  Mobley & Gilson (2017) Annu. Rev. Biophys. 46:531-558, "Proposed CB7 Set 1 benchmark data"
  and "Proposed CB7 Set 2 benchmark data" tables. Values transcribed from the authors'
  perpetual-review source, github.com/MobleyLab/benchmarksets, paper/benchmarkset.tex at
  commit 5233e0a1529b3c3ba9adf8c245de2b658e5fbf40 (tables cb7_benchmark1, cb7_benchmark2).
method: 1H NMR competition / direct binding (as stated in the source table footnote)
primary_sources:
  liu_2005:
    doi: 10.1021/ja055013x      # Liu et al., JACS 127:15959-15967 (2005); all guests except S1-5
  cao_2014:
    doi: 10.1002/anie.201309635 # Cao et al., Angew. Chem. Int. Ed. 53:988-993 (2014); guest S1-5
notes: >-
  Experiments in 50 mM sodium acetate buffer: Na+ binds the CB7 portals and acetic acid can
  compete for the cavity; the benchmark paper notes buffer changes move measured values by
  2.5-2.8 kcal/mol. The simulations here model the salt as NaCl (see systems/cb7/prep.yml)
  and do not model acetate, so a systematic offset is expected and ranking (Spearman,
  pairwise accuracy) is the primary score. Reported uncertainties (0.02-0.09) are far below
  the 0.4 kcal/mol noise floor in docs/GROUND_TRUTH.md; the floor, not these values, limits
  what a comparison can resolve. Guest S1-18 (1-adamantanecarboxylic acid) is ~1:1
  protonated at pH 4.74 per the benchmark README; the neutral (COOH) form, file guest-18, is
  simulated. The source text gives the range as -5.99 to -17.19, which predates S1-5
  (-18.22, Cao 2014) in the table; the table value is used. Leakage: Sage 2.3.0 was not fit
  to host-guest binding data to our knowledge, but CB7 has been used to tune and test
  methods in SAMPL3/4; good numbers here are weaker evidence than on a less-trodden set.
  DOIs checked through api.crossref.org on 2026-10-17.
added_by: Claude (branch-A build), for Attila Beleon
verified_on: 2026-10-17
