cv_definition:
  doi: 10.1016/j.jmb.2009.09.009
  text: "Beckstein, Denning, Perilla, Woolf (2009) Zipping and unzipping of adenylate kinase:
    atomistic insights into the ensemble of open <-> closed transitions. J. Mol. Biol.
    394:160-176 (PMC2803350)"
  verified: >-
    DOI resolved via api.crossref.org on 2026-10-10. The residue ranges were read from the
    Figure 1 legend of the PMC full text (PMC2803350): theta_NMP from the centres of geometry
    of backbone + CB atoms of residues 115-125, 90-100 (vertex), 35-55; theta_LID
    "defined equivalently" from 179-185, 115-125 (vertex), 125-153. The legend does not
    repeat "backbone and CB" for theta_LID; the same atom set is used, as in Beckstein's
    MDAnalysis course code (becksteinlab.physics.asu.edu, SimBioNano 2013, trajectories page),
    which uses "(backbone or name CB)" for all six groups.
  domain_boundaries_in_paper: "CORE 1-29, 60-121, 160-214; NMP 30-59; LID 122-159"
  published_crystal_values: >-
    The paper states only that 4AKE is "wide open" with theta_LID > 140 deg; no numeric
    angles for 4AKE/1AKE were taken from it. The values in results/c.parquet are computed here.
