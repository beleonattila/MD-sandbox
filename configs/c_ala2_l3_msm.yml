# L3c: MSM (deeptime) on the L2 trajectories. Run c_ala2_l2.yml first.
extends: c_ala2_base.yml
level: L3
method: msm_deeptime

msm:
  source_config: configs/c_ala2_l2.yml
  n_clusters: 100
  cluster_seed: 7
  lag_ps: 10.0
  its_lags_ps: [1, 2, 5, 10, 20, 50, 100, 200]
  n_its: 3
  ck_multiples: [1, 2, 4, 8, 16]
  n_samples: 200
